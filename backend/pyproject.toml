# GradRadar backend — dependency manifest (uv).
#
# `package = false` marks this as an APPLICATION, not a library: uv installs the
# dependencies into the venv without trying to build/install this project itself,
# so no build backend is needed.
#
# Keep `requires-python` in sync with the python313 in flake.nix and the
# python:3.13-slim in Dockerfile — the three must agree.

[project]
name = "grad-radar-backend"
version = "0.0.0"
description = "GradRadar backend — FastAPI service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # [standard] brings uvloop + httptools (C extensions). They build fine
    # inside the container; the host devShell never installs them, which is why
    # flake.nix needs no LD_LIBRARY_PATH today.
    "uvicorn[standard]>=0.34",
    # [asyncio] pulls greenlet, required by SQLAlchemy's async engine.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # Schema evolution. The app must NEVER call metadata.create_all() — every
    # change goes through a reviewed migration, so the database of today is
    # reproducible tomorrow.
    "alembic>=1.14",
    # Coletor (F5). httpx segue redirect por configuração, e três das fontes que
    # importam fazem 302 para o SEI — um cliente que não segue volta vazio.
    "httpx>=0.28",
    # Extração de PDF em Python puro: as datas, vagas e a grade horária moram
    # todas em PDF, não no HTML.
    "pypdf>=5.1",
    # Texto visível do HTML. Hash de HTML cru é ruidoso demais para detectar
    # mudança — ver o docstring do collector.
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # httpx drives FastAPI's ASGI transport in tests — no live server needed.
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async fixtures (the seed) need a session-scoped loop, otherwise
# pytest-asyncio tears the loop down between tests and the engine dies with it.
asyncio_default_fixture_loop_scope = "session"
# ...and the TESTS must share that loop. Default is function scope, which means
# each test gets a fresh loop while the module-level engine still holds
# connections created in the old one — asyncpg then fails deep in its protocol.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
