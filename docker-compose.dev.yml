# ═══════════════════════════════════════════════════════════════════════════════
# GradRadar — stack de DESENVOLVIMENTO local (`just dev`).
#
# Três serviços: frontend + backend → db. O ingress NÃO mora aqui: quem publica
# https://pos.v1cferr.dev, termina TLS e roteia /api/* é o Caddy central,
# declarado em ~/Projects/GitHub/v1cferr/dotfiles/system/services/caddy.nix.
#
# POR QUE CENTRALIZADO: só um processo faz bind na 443. Um Caddy por projeto não
# coexiste com outro, e o mapa de portas de loopback precisa de um dono único —
# o módulo dos dotfiles é esse dono (regra 14).
#
# Ambos publicam só em 127.0.0.1: a porta é a interface com o Caddy, não com a
# rede. As portas 3006/8006 estão anotadas no mapa daquele módulo; mudar aqui
# exige mudar lá.
#
# `restart: "no"` em tudo é deliberado no dev: containers NUNCA devem
# ressuscitar sozinhos depois de reboot ou restart do daemon, senão viram órfãos
# rodando sem ninguém pedir.
# ═══════════════════════════════════════════════════════════════════════════════
name: grad-radar

services:
  db:
    image: postgres:17-alpine # casa com o cliente postgresql_17 do devShell
    env_file:
      - .env
    # PEGADINHA: a porta 5432 do host já é do container `duo-db`
    # (dotfiles/system/services/duo.nix). Publicamos em 5433 para os dois
    # coexistirem. Dentro da rede do compose o Postgres continua em 5432 — é
    # esse o número que vai no DATABASE_URL.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # O backend espera este healthcheck (`condition: service_healthy`): sem ele
    # o uvicorn sobe antes do Postgres aceitar conexões e o primeiro /api/health
    # falha sem motivo real.
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv # volume anônimo: mantém o venv Linux do container, sem ser sobrescrito pelo bind-mount do host
    # `uv sync` a cada start é rápido (no-op quando o lock não mudou) e garante
    # que o venv do volume acompanhe mudanças no uv.lock sem rebuild da imagem.
    command: sh -c "uv sync --frozen && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Só no loopback: quem publica é o Caddy central. A 8006 está anotada no mapa
    # de portas em dotfiles/system/services/caddy.nix — mudar aqui exige mudar lá.
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: "no"

  frontend:
    image: node:22-alpine # casa com o nodejs_22 do devShell
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./frontend/web:/app
      # Volumes NOMEADOS para node_modules e .next: sem eles o container escreve
      # esses diretórios no host com dono root, e binários nativos compilados
      # para alpine vazam para o host (e vice-versa).
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    # Só no loopback: quem publica é o Caddy central (porta 3006 no mapa).
    ports:
      - "127.0.0.1:3006:3000"
    depends_on:
      backend:
        condition: service_started
    restart: "no"

volumes:
  db_data:
  frontend_node_modules:
  frontend_next:
  caddy_data:
  caddy_config:
