# ═══════════════════════════════════════════════════════════════════════════════
# GradRadar — stack de DESENVOLVIMENTO local (`just dev`).
#
# Quatro serviços: caddy (única porta de entrada) → frontend/backend → db.
# Nem backend nem frontend publicam porta: quem expõe é o Caddy, num único host
# (https://grad-radar.localhost), o que elimina CORS e portas hardcoded.
#
# `restart: "no"` em tudo é deliberado no dev: containers NUNCA devem
# ressuscitar sozinhos depois de reboot ou restart do daemon, senão viram órfãos
# rodando sem ninguém pedir.
#
# Só existe este arquivo de compose (sem .prod.yml) porque o escopo hoje é local.
# ═══════════════════════════════════════════════════════════════════════════════
name: grad-radar

services:
  db:
    image: postgres:17-alpine # casa com o cliente postgresql_17 do devShell
    env_file:
      - .env
    # PEGADINHA: a porta 5432 do host já é do container `duo-db`
    # (dotfiles/system/services/duo.nix). Publicamos em 5433 para os dois
    # coexistirem. Dentro da rede do compose o Postgres continua em 5432 — é
    # esse o número que vai no DATABASE_URL.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # O backend espera este healthcheck (`condition: service_healthy`): sem ele
    # o uvicorn sobe antes do Postgres aceitar conexões e o primeiro /api/health
    # falha sem motivo real.
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv # volume anônimo: mantém o venv Linux do container, sem ser sobrescrito pelo bind-mount do host
    # `uv sync` a cada start é rápido (no-op quando o lock não mudou) e garante
    # que o venv do volume acompanhe mudanças no uv.lock sem rebuild da imagem.
    command: sh -c "uv sync --frozen --no-dev && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: "no"

  frontend:
    image: node:22-alpine # casa com o nodejs_22 do devShell
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./frontend/web:/app
      # Volumes NOMEADOS para node_modules e .next: sem eles o container escreve
      # esses diretórios no host com dono root, e binários nativos compilados
      # para alpine vazam para o host (e vice-versa).
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_started
    restart: "no"

  caddy:
    image: caddy:2-alpine
    # Sem prefixo 127.0.0.1 de propósito: assim o Docker publica em IPv4 E IPv6,
    # e o browser — que resolve grad-radar.localhost para ::1 primeiro — conecta
    # de primeira. O firewall do host já mantém 80/443 fechadas para fora
    # (dotfiles/system/net/network.nix abre só 2222), então isto não expõe nada.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # abriga a CA interna (ver `just trust-ca`) — NÃO apagar sem necessidade
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: "no"

volumes:
  db_data:
  frontend_node_modules:
  frontend_next:
  caddy_data:
  caddy_config:
