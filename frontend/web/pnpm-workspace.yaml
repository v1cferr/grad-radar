# pnpm settings. This file exists ONLY for the setting below — GradRadar is not a
# pnpm workspace and declares no `packages:`.
#
# WHY here and not in package.json: pnpm 11 stopped reading the `pnpm` field of
# package.json and moved every setting to this file. It warns and ignores the old
# location, which is easy to miss. The key is `allowBuilds` (a map), which
# replaced the older `onlyBuiltDependencies` list.
#
# WHY it is needed at all: pnpm 10+ refuses to run dependency build scripts by
# default, and since v11 that refusal FAILS the install with
# ERR_PNPM_IGNORED_BUILDS instead of just warning. The non-zero exit breaks the
# compose command chain (`pnpm install --frozen-lockfile && next dev`), so the
# frontend container dies before the dev server ever starts. Every dependency
# with a postinstall has to be decided here explicitly — including the ones we
# decide AGAINST, or the error comes back.
allowBuilds:
  # Next.js's optional native image optimizer.
  sharp: true
  # DENIED on purpose. Playwright's postinstall downloads browser binaries that
  # are not FHS-compatible and would not run on NixOS anyway — the devShell
  # supplies them from nixpkgs via PLAYWRIGHT_BROWSERS_PATH. Denying it also
  # keeps the frontend container from pulling ~400 MB it never uses.
  playwright: false
  playwright-core: false
  "@playwright/test": false
  # Resolver nativo que vem com o eslint-config-next. Precisa compilar, e o pnpm 11
  # FALHA em vez de avisar quando um build fica ignorado — o que mata o
  # `pnpm install && next dev` do container sem mensagem óbvia. Mesma lição do sharp.
  unrs-resolver: true
